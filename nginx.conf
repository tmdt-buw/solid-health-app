server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;

    location = / {
        return 302 /solid-health-app/;
    }

    location = /solid-health-app {
        return 301 /solid-health-app/;
    }

    location /solid-health-app/ {
        try_files $uri $uri/ /solid-health-app/index.html;
    }
}
